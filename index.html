<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>منصة الراشدي للعلوم</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="منصة الراشدي للعلوم" />
<meta name="theme-color" content="#14453D" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2314453D'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle'%3E%F0%9F%93%98%3C/text%3E%3C/svg%3E" />
<style>
@font-face { font-family:'Tajawal'; src:local('Tajawal'); }
:root{
  --ink:#14453D; --ink-soft:rgba(20,69,61,.65); --paper:#FBF6EC; --paper-line:#E8DFC9;
  --math:#2A6F8E; --math-light:#E4EFF3; --science:#5C7A4A; --science-light:#EBF1E6;
  --amber:#E8A33D; --amber-dark:#C97F1F; --amber-light:#FBEED9; --brick:#C1443C; --brick-light:#F8E4E2;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
  background-color:var(--paper);
  background-image:repeating-linear-gradient(var(--paper-line) 0 1px, transparent 1px 34px);
  background-position:0 8px;
  color:var(--ink);
  min-height:100vh;
}
.display{ font-family:'Rakkas','Amiri',serif; }
a{ color:inherit; }
button{ font-family:inherit; }

.center-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.auth-wrap{ width:100%; max-width:380px; }
.brand{ text-align:center; margin-bottom:22px; }
.brand-badge{ width:72px; height:72px; border-radius:22px; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, var(--ink), #1d5c50); font-size:32px; box-shadow:0 10px 24px -8px rgba(20,69,61,.45); }
.brand h1{ font-size:27px; margin:0; line-height:1.25; }
.brand p{ font-size:13px; color:var(--ink-soft); margin:6px 0 0; }

.card{ background:#fff; border:1px solid var(--paper-line); border-radius:18px; padding:18px; box-shadow:0 2px 10px -4px rgba(20,69,61,.08); }
.card.accent{ border-width:1.5px; }

.field{ display:block; margin-bottom:12px; }
.field-label{ display:block; font-size:13px; font-weight:700; margin-bottom:6px; }
.input{ width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid var(--paper-line); font-size:14px; font-family:inherit; background:#fdfbf6; color:var(--ink); outline:none; transition:border-color .15s, background .15s; }

/* محرر ملخص الدرس الغني (لصق نصوص وصور مباشرة) */
.rich-editor{ min-height:240px; max-height:520px; overflow-y:auto; border:1.5px solid var(--paper-line); border-radius:14px; padding:16px; font-family:inherit; font-size:15px; line-height:1.85; background:#fdfbf6; color:var(--ink); outline:none; transition:border-color .15s, box-shadow .15s; white-space:pre-wrap; }
.rich-editor:focus{ border-color:var(--ink); box-shadow:0 0 0 3px rgba(20,69,61,.08); background:#fff; }
.rich-editor img{ max-width:100%; border-radius:12px; margin:10px 0; display:block; box-shadow:0 4px 12px -6px rgba(20,69,61,.2); }
.rich-editor:empty:before{ content:attr(data-placeholder); color:#9CA79F; pointer-events:none; }
.img-upload-placeholder{ display:inline-block; background:#F1EEE3; padding:5px 12px; border-radius:8px; font-size:12.5px; color:var(--ink-soft); font-weight:700; }
.rich-toolbar-hint{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); margin:6px 2px 10px; }
.lesson-reading{ font-size:15px; line-height:1.9; color:var(--ink); }
.lesson-reading img{ max-width:100%; border-radius:12px; margin:12px 0; display:block; box-shadow:0 4px 12px -6px rgba(20,69,61,.2); }

/* صندوق إجابة التلميذ المباشرة على التمرين */
.exercise-answer-box{ margin-top:8px; padding:12px; background:#fdfbf6; border:1.5px dashed var(--paper-line); border-radius:12px; }
.exercise-answer-box textarea{ min-height:70px; }
.exercise-answer-saved{ background:var(--science-light); border:1px solid var(--science); border-radius:10px; padding:10px 12px; font-size:13.5px; color:var(--ink); white-space:pre-wrap; margin-top:6px; }
.input:focus{ border-color:var(--math); background:#fff; }
textarea.input{ min-height:90px; resize:vertical; line-height:1.6; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:12px 19px; border-radius:11px; font-size:14px; font-weight:700; border:none; cursor:pointer; box-shadow:0 3px 10px -3px rgba(20,69,61,.35); transition:transform .12s, box-shadow .12s; }
.btn:active{ transform:scale(.96); box-shadow:0 1px 4px -1px rgba(20,69,61,.3); }
.btn:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }
.btn-block{ width:100%; }
.btn-sm{ padding:9px 13px; font-size:13px; }
.btn-icon{ padding:8px; border-radius:9px; border:none; cursor:pointer; display:inline-flex; transition:background .15s; }

.tab-toggle-row{ display:flex; gap:6px; padding:4px; border-radius:13px; background:#fff; border:1px solid var(--paper-line); margin-bottom:16px; box-shadow:0 2px 8px -4px rgba(20,69,61,.08); }
.tab-toggle{ flex:1; padding:10px 6px; border-radius:9px; border:none; background:none; font-weight:700; font-size:14px; cursor:pointer; color:var(--ink-soft); transition:background .15s, color .15s; }
.tab-toggle.active{ background:linear-gradient(135deg, var(--ink), #1d5c50); color:#fff; box-shadow:0 3px 8px -3px rgba(20,69,61,.4); }

.app-header{ position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:linear-gradient(120deg, var(--ink), #1c574c); color:#fff; box-shadow:0 3px 12px -4px rgba(20,69,61,.5); flex-wrap:nowrap; overflow:hidden; gap:8px; }
.app-header .brandline{ display:flex; align-items:center; gap:8px; font-size:16px; font-weight:800; white-space:nowrap; flex-shrink:0; }
.app-header .brand-ic{ width:32px; height:32px; border-radius:11px; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; font-size:16px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); }
.app-header .userline{ display:flex; align-items:center; gap:6px; flex-shrink:0; background:rgba(255,255,255,.08); padding:5px 6px; border-radius:17px; }
.app-header .uname{ font-size:12px; font-weight:700; line-height:1.2; text-align:left; }
.app-header .urole{ font-size:10px; color:rgba(255,255,255,.65); line-height:1.2; }
.avatar{ width:34px; height:34px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; flex-shrink:0; font-size:15px; box-shadow:0 0 0 2px rgba(255,255,255,.35), 0 2px 6px rgba(0,0,0,.18); }
.logout-btn{ background:rgba(255,255,255,.12); border:none; color:rgba(255,255,255,.92); cursor:pointer; padding:8px 9px; border-radius:12px; font-size:15px; line-height:1; transition:transform .12s, background .12s; }
.logout-btn:active{ transform:scale(.88); }
.logout-btn.accent-amber{ background:rgba(232,163,61,.28); color:#FBEED9; }
.logout-btn.accent-amber:active{ background:rgba(232,163,61,.42); }
.logout-btn.accent-brick{ background:rgba(193,68,60,.24); color:#F8E4E2; }
.logout-btn.accent-brick:active{ background:rgba(193,68,60,.38); }

.app-main{ max-width:640px; margin:0 auto; padding-bottom:100px; min-height:60vh; animation:pageIn .28s ease both; }
@keyframes pageIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

.bottom-nav{ position:fixed; bottom:0; left:0; right:0; z-index:30; background:#fff; border-top:1px solid var(--paper-line); display:flex; justify-content:space-around; padding:7px 4px; box-shadow:0 -4px 14px -6px rgba(20,69,61,.15); }
.nav-btn{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 15px; border-radius:13px; background:none; border:none; font-weight:700; font-size:11px; color:#9CA79F; position:relative; cursor:pointer; transition:background .15s; }
.nav-btn.active-nav{ background:var(--amber-light); }
.nav-btn .ic{ font-size:20px; }
.nav-badge{ position:absolute; top:-2px; left:8px; min-width:16px; height:16px; padding:0 4px; border-radius:8px; font-size:10px; font-weight:700; color:#fff; background:var(--brick); display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px #fff; }

.section-title{ display:flex; align-items:center; gap:8px; padding:22px 16px 12px; }
.section-title .ic{ font-size:18px; }
.section-title h2{ font-family:'Rakkas',serif; font-size:20px; margin:0; }

.hero{ margin:16px; border-radius:22px; padding:22px 20px; background:linear-gradient(135deg, var(--ink) 0%, #1d5c50 55%, #2a7a67 100%); color:#fff; position:relative; overflow:hidden; box-shadow:0 12px 28px -10px rgba(20,69,61,.55); }
.hero::after{ content:''; position:absolute; left:-30px; bottom:-40px; width:150px; height:150px; border-radius:50%; background:rgba(255,255,255,.05); }
.hero::before{ content:''; position:absolute; right:-20px; top:-30px; width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,.06); }
.hero .hero-decor{ position:absolute; opacity:.35; pointer-events:none; }
.hero .hero-decor.hd-tl{ top:10px; left:14px; transform:rotate(-8deg); }
.hero .hero-decor.hd-br{ bottom:12px; right:16px; transform:rotate(10deg); }
.icon3d-wrap{ display:inline-flex; align-items:center; justify-content:center; }
.icon3d{ display:block; }
.hero .pre{ font-size:13px; color:rgba(255,255,255,.7); margin:0; position:relative; }
.hero .big{ font-family:'Rakkas',serif; font-size:26px; margin:3px 0 0; position:relative; }
.hero .sub{ font-size:12.5px; color:rgba(255,255,255,.62); margin:5px 0 0; position:relative; font-weight:700; }

/* شعار المنصة العلوي */
.platform-banner{ margin:16px 16px 4px; text-align:center; padding:16px 8px 6px; position:relative; }
.platform-banner .pb-row{ display:flex; align-items:center; justify-content:center; gap:10px; }
.platform-banner .pb-emo{ opacity:.9; }
.platform-banner h1{ font-family:'Rakkas',serif; font-size:26px; margin:0; color:var(--ink); }
.platform-banner h1 .accent{ color:var(--amber-dark); position:relative; }
.platform-banner .pb-sparkle{ font-size:13px; vertical-align:top; }

/* بطاقات إحصائية بشارة أيقونة */
.stat-row{ display:flex; gap:10px; padding:0 16px; flex-wrap:wrap; }
.stat-card{ background:#fff; border-radius:18px; padding:16px 8px 14px; flex:1; min-width:78px; text-align:center; box-shadow:0 6px 16px -8px rgba(20,69,61,.16); }
.stat-card .badge{ width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center; margin:0 auto 9px; font-size:19px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.03); }
.stat-value{ font-size:21px; font-weight:800; }
.stat-label{ font-size:10.5px; color:var(--ink-soft); margin-top:3px; font-weight:700; }

/* بطاقة الأداء بميدالية */
.perf-card{ margin:0 16px 20px; background:linear-gradient(135deg,#fff 0%,#fdfaf2 100%); border-radius:20px; padding:18px; display:flex; align-items:center; gap:16px; box-shadow:0 8px 20px -10px rgba(20,69,61,.18); position:relative; overflow:hidden; }
.perf-card .trophy{ flex-shrink:0; filter:drop-shadow(0 3px 4px rgba(0,0,0,.12)); }
.perf-card .encourage{ font-size:11.5px; color:var(--amber-dark); font-weight:800; margin-top:4px; }

.stat-row{ display:flex; gap:10px; padding:0 16px; flex-wrap:wrap; }
.stat-card{ background:#fff; border:1px solid var(--paper-line); border-radius:14px; padding:14px; flex:1; min-width:110px; box-shadow:0 2px 8px -4px rgba(20,69,61,.08); }


.tabpill-row{ display:flex; gap:8px; padding:0 16px 12px; overflow-x:auto; }

/* جدول الفهرس */
/* مخطط أقسام المحتوى (خريطة ذهنية) */
/* الألعاب التفاعلية */
.game-hud{ display:flex; justify-content:space-between; padding:4px 4px 14px; font-weight:800; font-size:15px; }
.game-qcard{ background:#fff; border-radius:18px; padding:26px 16px; text-align:center; box-shadow:0 6px 16px -8px rgba(20,69,61,.18); margin-bottom:16px; }
.game-qtext{ font-size:22px; font-weight:800; color:var(--ink); margin:0; }
.game-opts{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.game-opt{ background:#fff; border:2px solid; border-radius:14px; padding:16px 8px; font-weight:800; font-size:15px; font-family:inherit; cursor:pointer; color:var(--ink); transition:transform .1s; }
.game-opt:active{ transform:scale(.96); }
.game-opt.correct{ background:var(--science-light); border-color:var(--science); color:var(--science); }
.memory-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
.memory-card{ aspect-ratio:1; border-radius:14px; border:2px solid var(--paper-line); background:#fff; font-size:19px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:4px; text-align:center; line-height:1.15; font-family:inherit; color:var(--ink-soft); transition:transform .15s; }
.memory-card.flipped{ transform:scale(1.02); }
.memory-card.matched{ opacity:.55; }
.memory-card:not(.flipped):active{ transform:scale(.95); }

.hub-wrap{ display:flex; justify-content:center; padding:22px 10px 34px; }
.hub-diagram{ position:relative; width:300px; height:300px; flex-shrink:0; }
.hub-center{ position:absolute; left:150px; top:150px; transform:translate(-50%,-50%); width:104px; height:104px; border-radius:50%; background:#fff; border:3px dashed; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; z-index:5; box-shadow:0 6px 18px -6px rgba(20,69,61,.28); }
.hub-line{ position:absolute; height:3px; transform-origin:0 50%; z-index:1; opacity:.5; border-radius:2px; }
.hub-dot{ position:absolute; width:10px; height:10px; border-radius:50%; transform:translate(-50%,-50%); z-index:2; box-shadow:0 0 0 3px #fff; }
.hub-node{ position:absolute; transform:translate(-50%,-50%); width:94px; height:94px; border-radius:22px; border:2px solid; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; cursor:pointer; font-family:inherit; z-index:3; box-shadow:0 4px 10px -6px rgba(20,69,61,.2); padding:6px; text-align:center; }
.hub-node:active{ transform:translate(-50%,-50%) scale(.94); }
.hub-ic{ font-size:24px; }
.hub-label{ font-weight:800; font-size:10px; line-height:1.25; }

.index-table-wrap{ overflow-x:auto; border-radius:14px; box-shadow:0 4px 14px -8px rgba(20,69,61,.2); }
.index-table{ width:100%; border-collapse:collapse; background:#fff; font-size:12.5px; min-width:420px; }
.index-table th{ background:var(--ink); color:#fff; padding:10px 8px; font-weight:800; font-size:11.5px; text-align:center; white-space:nowrap; }
.index-table th:nth-child(2){ text-align:right; }
.index-table td{ padding:10px 8px; border-bottom:1px solid var(--paper-line); text-align:center; }
.index-table tbody tr{ cursor:pointer; transition:background .12s; }
.index-table tbody tr:active{ background:var(--paper); }
.index-table tbody tr:nth-child(even){ background:#FBF9F2; }
.idx-num{ font-weight:800; color:var(--ink-soft); width:28px; }
.idx-title{ text-align:right; font-weight:700; color:var(--ink); }
.idx-subject-badge{ display:inline-block; padding:3px 8px; border-radius:999px; font-size:10.5px; font-weight:800; white-space:nowrap; }
.idx-center{ text-align:center; }
.tabpill{ padding:8px 17px; border-radius:999px; font-size:13px; font-weight:700; border:1.5px solid; white-space:nowrap; cursor:pointer; background:#fff; transition:transform .12s; }
.tabpill:active{ transform:scale(.95); }

.empty-state{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:46px 20px; }
.empty-icon{ width:60px; height:60px; border-radius:999px; background:linear-gradient(135deg, var(--amber-light), #f6dfb8); display:flex; align-items:center; justify-content:center; margin-bottom:12px; font-size:27px; box-shadow:0 4px 12px -4px rgba(201,127,31,.3); }
.empty-title{ font-weight:800; font-size:15px; }
.empty-sub{ font-size:13px; color:var(--ink-soft); margin-top:4px; max-width:260px; }

.stamp{ border-radius:999px; display:flex; flex-direction:column; align-items:center; justify-content:center; flex-shrink:0; transform:rotate(-8deg); border-style:double; border-width:4px; animation:stampIn .55s cubic-bezier(.34,1.56,.64,1) both; box-shadow:0 6px 16px -6px rgba(20,69,61,.25); }
.stamp .pct{ font-family:'Rakkas',serif; }
.stamp .lbl{ font-family:'Rakkas',serif; margin-top:-4px; }
@keyframes stampIn{ 0%{ transform:rotate(-8deg) scale(2.3); opacity:0; } 70%{ transform:rotate(-8deg) scale(.95); opacity:1; } 100%{ transform:rotate(-8deg) scale(1); opacity:1; } }

.list-px{ padding:0 16px; display:flex; flex-direction:column; gap:10px; }

.lesson-wrap{ position:relative; padding-top:12px; }
.lesson-tag{ position:absolute; top:0; right:16px; padding:4px 13px; border-radius:8px 8px 0 0; font-size:11px; font-weight:700; color:#fff; box-shadow:0 -2px 6px -2px rgba(0,0,0,.15); }
.lesson-card{ width:100%; text-align:right; background:#fff; border:1px solid var(--paper-line); border-radius:16px; padding:15px 15px 13px; cursor:pointer; font-family:inherit; display:block; box-shadow:0 3px 12px -6px rgba(20,69,61,.12); transition:transform .12s, box-shadow .12s; }
.lesson-card:active{ transform:scale(.98); }
.lesson-card .title{ font-weight:800; font-size:15px; margin:0; }
.lesson-card .excerpt{ font-size:12.5px; color:var(--ink-soft); margin:5px 0 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.lesson-card .meta{ display:flex; gap:12px; margin-top:9px; font-size:11px; font-weight:700; flex-wrap:wrap; }

.row-card{ background:#fff; border:1px solid var(--paper-line); border-radius:14px; padding:12px; display:flex; align-items:center; gap:10px; box-shadow:0 2px 8px -5px rgba(20,69,61,.1); }
.row-card .info{ flex:1; min-width:0; }
.row-card .info .t1{ font-weight:800; font-size:14px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row-card .info .t2{ font-size:11.5px; color:var(--ink-soft); margin:2px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.badge-score{ text-align:center; padding:6px 11px; border-radius:9px; font-weight:800; font-size:14px; flex-shrink:0; }

details.addbox{ background:#fff; border:1.5px dashed var(--paper-line); border-radius:12px; }
details.addbox summary{ list-style:none; padding:12px 14px; font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:8px; }
details.addbox summary::-webkit-details-marker{ display:none; }
details.addbox[open] summary{ border-bottom:1px solid var(--paper-line); }
details.addbox .inner{ padding:14px; }

details.exercise{ background:#fff; border:1px solid var(--paper-line); border-radius:11px; padding:12px 14px; }
details.exercise summary{ list-style:none; cursor:pointer; }
details.exercise summary::-webkit-details-marker{ display:none; }
details.exercise .q{ font-weight:700; font-size:14px; display:inline; }
details.exercise .reveal-hint{ font-size:12px; font-weight:700; margin-right:6px; }
details.exercise .ans{ margin-top:9px; padding:9px 11px; border-radius:8px; font-size:13.5px; }

.qrow{ background:var(--paper); border:1px solid var(--paper-line); border-radius:10px; padding:11px; margin-bottom:10px; }
.qrow-head{ display:flex; align-items:center; justify-content:between; justify-content:space-between; margin-bottom:7px; font-size:12px; font-weight:700; color:var(--ink-soft); }
.opt-line{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.opt-line .input{ flex:1; padding:7px 10px; }

.quiz-q{ background:#fff; border:1px solid var(--paper-line); border-radius:13px; padding:14px; margin-bottom:12px; }
.quiz-q .qtext{ font-weight:800; font-size:14px; margin:0 0 10px; }
.quiz-opt{ display:flex; align-items:center; gap:10px; padding:10px 13px; border-radius:9px; border:1.5px solid var(--paper-line); margin-bottom:7px; cursor:pointer; background:var(--paper); }
.quiz-review{ display:flex; align-items:flex-start; gap:9px; border-radius:11px; padding:12px; border-width:1.5px; border-style:solid; background:#fff; margin-bottom:9px; }

.toast{ position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:100; padding:11px 18px; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,.18); font-size:13.5px; font-weight:700; color:#fff; display:flex; align-items:center; gap:8px; opacity:0; transition:opacity .25s, top .25s; pointer-events:none; }
.toast.show{ opacity:1; top:16px; }

.link-btn{ background:none; border:none; cursor:pointer; font-weight:700; font-size:13px; font-family:inherit; padding:0; display:inline-flex; align-items:center; gap:5px; }
.small-muted{ font-size:12px; color:var(--ink-soft); }
.mb0{margin-bottom:0;}
.mt2{margin-top:8px;}

/* Colorful lesson-tile dashboard (student home) */
.subj-banner{ display:flex; align-items:center; justify-content:center; gap:8px; padding:11px; border-radius:999px; font-weight:800; font-size:15px; margin:0 16px 12px; }
.tile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 16px 6px; }
.tile{ border-radius:22px; padding:18px 10px 15px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:7px; cursor:pointer; border:none; font-family:inherit; box-shadow:0 4px 0 rgba(0,0,0,.06), 0 8px 16px -8px rgba(20,69,61,.18); min-height:108px; }
.tile:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.06); }
.tile .tile-ic{ font-size:30px; }
.tile .tile-label{ font-weight:800; font-size:12.5px; line-height:1.3; }
.tile .tile-sub{ font-size:10px; opacity:.75; font-weight:700; }

/* Side-by-side subject category grid (home dashboard) */
.subject-columns{ display:flex; gap:10px; padding:0 14px 6px; align-items:flex-start; }
.subject-col{ flex:1; min-width:0; }
.subj-banner-sm{ text-align:center; padding:10px 4px; border-radius:999px; font-weight:800; font-size:13px; margin-bottom:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; box-shadow:0 3px 8px -4px rgba(20,69,61,.15); }
.tile-grid-sm{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.tile-sm{ border-radius:17px; padding:13px 4px 11px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; cursor:pointer; border:none; font-family:inherit; box-shadow:0 3px 0 rgba(0,0,0,.06), 0 5px 12px -6px rgba(20,69,61,.16); min-height:80px; }
.tile-sm:active{ transform:translateY(1px); box-shadow:0 1px 0 rgba(0,0,0,.06); }
.tile-ic-sm{ font-size:21px; }
.tile-label-sm{ font-weight:800; font-size:11px; line-height:1.2; }

/* الخيارات: توزيع المقاعد */
.board-label{ text-align:center; background:#EFE9DC; color:var(--ink); border-radius:10px; padding:9px; font-weight:800; font-size:12.5px; margin:6px 0 12px; }
.seating-grid{ display:grid; gap:7px; }
.seat{ aspect-ratio:1; border-radius:10px; border:1.5px dashed var(--paper-line); background:#fdfbf6; color:var(--ink-soft); font-size:10.5px; font-weight:800; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:2px; overflow:hidden; text-align:center; word-break:break-word; line-height:1.15; }
.seat.filled{ border-style:solid; border-color:var(--math); background:var(--math-light,#E4EFF3); color:var(--math); }
.seat:active{ transform:scale(.94); }

/* الخيارات: الفرق */
.chip{ display:inline-flex; align-items:center; gap:6px; background:#F1EEE3; color:var(--ink); border-radius:999px; padding:6px 6px 6px 12px; font-size:12.5px; font-weight:700; }
.chip button{ border:none; background:#fff; color:var(--brick,#C1443C); width:18px; height:18px; border-radius:50%; font-weight:800; font-size:12px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }

/* منتقي المقعد */
.seat-picker-overlay{ position:fixed; inset:0; background:rgba(20,69,61,.45); z-index:50; display:flex; align-items:flex-end; }
.seat-picker-sheet{ background:#fff; width:100%; max-height:72vh; border-radius:20px 20px 0 0; padding:14px 0 6px; display:flex; flex-direction:column; }
.seat-picker-head{ display:flex; justify-content:space-between; align-items:center; padding:0 18px 12px; font-weight:800; font-size:14.5px; border-bottom:1px solid var(--paper-line); margin-bottom:8px; }
.seat-picker-head button{ border:none; background:none; font-size:18px; cursor:pointer; color:var(--ink-soft); }
.seat-picker-list{ overflow-y:auto; padding:2px 14px 14px; display:flex; flex-direction:column; gap:6px; }
.seat-picker-row{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; border:none; background:#fdfbf6; cursor:pointer; font-family:inherit; font-weight:700; font-size:13.5px; text-align:right; width:100%; }
.seat-picker-row.clear{ color:var(--brick,#C1443C); background:#F8E4E2; }
.seat-picker-row.active{ background:var(--math-light); }
.seat-picker-row:disabled{ opacity:.6; cursor:default; }

/* تبويبات فرعية لمحتوى الدرس */
.seg-tabs{ display:flex; gap:6px; padding:0 16px 12px; overflow-x:auto; }
.seg-tab{ display:flex; align-items:center; gap:5px; padding:8px 12px; border-radius:12px; border:none; background:#F1EEE3; font-weight:700; font-size:12px; white-space:nowrap; cursor:pointer; font-family:inherit; flex-shrink:0; position:relative; }
.seg-tab .seg-ic{ font-size:14px; }
.seg-tab .seg-count{ background:rgba(0,0,0,.08); border-radius:999px; padding:1px 6px; font-size:10.5px; font-weight:800; }
.seg-tab.seg-active .seg-count{ background:rgba(255,255,255,.25); }
.seg-badge{ position:absolute; top:-5px; left:-5px; background:var(--brick); color:#fff; border-radius:999px; min-width:16px; height:16px; font-size:9.5px; font-weight:800; display:flex; align-items:center; justify-content:center; padding:0 3px; }
</style>

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function fmtDate(ts){
  try { return new Date(ts).toLocaleDateString('ar-TN'); } catch(e){ return new Date(ts).toLocaleDateString(); }
}
function gradeInfo(pct){
  if (pct >= 90) return { label:'ممتاز!', color:COLORS.amberDark, bg:COLORS.amberLight };
  if (pct >= 70) return { label:'جيد جدا', color:COLORS.ink, bg:COLORS.mathLight };
  if (pct >= 50) return { label:'جيد', color:COLORS.science, bg:COLORS.scienceLight };
  return { label:'يحتاج مراجعة', color:COLORS.brick, bg:COLORS.brickLight };
}
function classGroupsOf(students){
  var groups = [];
  students.forEach(function(u){
    var g = u.classGroup || 'بدون فصل';
    if(groups.indexOf(g)===-1) groups.push(g);
  });
  groups.sort(function(a,b){ return a.localeCompare(b,'ar'); });
  return groups;
}
function classTabRow(groups, active, onclickFnName, extraColor){
  if(groups.length<=1) return '';
  var color = extraColor || COLORS.math;
  var html = '<div class="tabpill-row">';
  html += '<button class="tabpill" style="'+(active==='all'?('background:'+COLORS.ink+';color:#fff;border-color:'+COLORS.ink):('color:'+COLORS.ink+';border-color:'+COLORS.ink+'55'))+'" onclick="'+onclickFnName+'(\'all\')">الكل</button>';
  groups.forEach(function(g){
    var isActive = active===g;
    html += '<button class="tabpill" style="'+(isActive?('background:'+color+';color:#fff;border-color:'+color):('color:'+color+';border-color:'+color+'55'))+'" onclick="'+onclickFnName+'(\''+esc(g).replace(/'/g,"\\'")+'\')">'+esc(g)+'</button>';
  });
  html += '</div>';
  return html;
}
function allEntries(){
  var fromResults = DB.results.map(function(r){
    return { id:r.id, kind:'quiz', studentUsername:r.studentUsername, subject:r.subject, lessonId:r.lessonId, score:r.score, total:r.total, date:r.date, label:r.testTitle };
  });
  var fromGrades = DB.grades.map(function(g){
    return { id:g.id, kind:'exercise', studentUsername:g.studentUsername, subject:g.subject, lessonId:g.lessonId, score:g.score, total:g.total, date:g.date, label: g.note ? ('تقييم تمارين — '+g.note) : 'تقييم تمارين' };
  });
  return fromResults.concat(fromGrades);
}

    try {
      var cached = localStorage.getItem(LS_CACHE_PREFIX + key);
      if (cached !== null) return JSON.parse(cached);
    } catch (e2) {}
    return fallback;
  }
}
async function apiSet(key, value){
  try { localStorage.setItem(LS_CACHE_PREFIX + key, JSON.stringify(value)); } catch(e){}
  try {
    var res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'set', key: key, value: JSON.stringify(value) })
    });
    var data = await res.json();
    return !!(data && data.ok);
  } catch (e) {
    return false;
  }
}

function migrateLessonTests(){
  var changedContent = { math:false, eveil:false };
  var changedTests = { math:false, eveil:false };
  Object.keys(DB.content).forEach(function(subject){
    DB.content[subject].forEach(function(lesson){
      if(lesson.tests && lesson.tests.length){
        lesson.tests.forEach(function(t){
          DB.looseTests[subject].push(t);
          changedTests[subject] = true;
        });
        lesson.tests = [];
        changedContent[subject] = true;
      }
    });
  });
  Object.keys(changedContent).forEach(function(subject){
    if(changedContent[subject]) saveContent(subject);
    if(changedTests[subject]) saveLooseTests(subject);
  });
}

var toastTimer = null;

              variant==='soft'  ? ('background:'+color+'1a;color:'+color+';') :
              ('background:transparent;color:'+color+';border:1.5px solid '+color+';');

function adminContentHub(meta){
  var nodes = [
    { key:'index',   label:'فهرس',                     icon:'📖', color:'#2A6F8E', light:'#EAF3FA' },
    { key:'daily',   label:'دروس يومية',                icon:'📅', color:'#3E9B6F', light:'#EAF7EF' },
    { key:'lessons', label:'ملخصات دروس وتمارين',        icon:'📚', color:'#D6447E', light:'#FDEBF2' },
    { key:'tests',   label:'تقييم واختبارات',            icon:'⏱️', color:'#E08A2B', light:'#FDF1E2' },
    { key:'results', label:'النتائج والملاحظات',         icon:'📋', color:'#7B4FC9', light:'#F1EBFB' },
    { key:'games',   label:'ألعاب تعليمية',             icon:'🎮', color:'#1F9B8E', light:'#E6F7F5' }
  ];
  if(ui.adminSubject==='eveil'){
    nodes.push({ key:'videos', label:'فيديوهات الدروس', icon:'🎬', color:'#C0392B', light:'#FCEAEA' });
  }
  var cx = 150, cy = 150, r = 118;
  var angleStep = 360 / nodes.length;
  var html = '<div class="hub-wrap"><div class="hub-diagram">';
  nodes.forEach(function(n, i){
    var angle = -90 + i * angleStep;
    var rad = angle * Math.PI / 180;
    var x = cx + r * Math.cos(rad);
    var y = cy + r * Math.sin(rad);
    var dx = x - cx, dy = y - cy;
    var dist = Math.sqrt(dx*dx + dy*dy);
    var lineAngle = Math.atan2(dy, dx) * 180 / Math.PI;
    html += '<div class="hub-line" style="left:'+cx+'px;top:'+cy+'px;width:'+dist+'px;background:'+n.color+';transform:rotate('+lineAngle+'deg)"></div>';
    html += '<div class="hub-dot" style="left:'+(cx+dx*0.4)+'px;top:'+(cy+dy*0.4)+'px;background:'+n.color+'"></div>';
    html += '<button class="hub-node" style="left:'+x+'px;top:'+y+'px;background:'+n.light+';border-color:'+n.color+'" onclick="setAdminContentTab(\''+n.key+'\')">' +
      '<span class="hub-ic">'+n.icon+'</span><span class="hub-label" style="color:'+n.color+'">'+n.label+'</span></button>';
  });
  html += '<div class="hub-center" style="border-color:'+meta.color+';color:'+meta.color+'">المحتوى</div>';
  html += '</div></div>';
  return html;
}

      parsed = JSON.parse(text1.replace(/```json|```/g, '').trim());

      gameObj = { id:uid(), type:'speed', title: title || ('تحدي: '+promptTopic), questions: parsed.map(function(q){
        return { q:q.q, options:(q.options||[]).slice(0,4), correct: (typeof q.correct==='number'?q.correct:0) };
      }), createdAt: Date.now() };
    } else {
      promptText = 'أنشئ '+count+' أزواج مطابقة (لعبة ذاكرة) مناسبة لتلاميذ السنة السادسة ابتدائي في تونس، لمادة '+subjectName+
        '، حول: "'+promptTopic+'". كل زوج يتكوّن من (a) وهو المصطلح أو السؤال القصير، و(b) وهو تعريفه أو إجابته أو ما يقابله. ' +
        'أعد النتيجة بصيغة JSON فقط بدون أي نص إضافي وبدون علامات ```، بهذا الشكل بالضبط: [{"a":"...","b":"..."}]. اجعل كل نص قصيرا (أقل من 25 حرفا).';
      var text2 = await callGemini(promptText);
      parsed = JSON.parse(text2.replace(/```json|```/g, '').trim());
      if(!Array.isArray(parsed) || parsed.length===0){ throw new Error('تنسيق غير متوقع من الذكاء الاصطناعي'); }
      gameObj = { id:uid(), type:'memory', title: title || ('ذاكرة: '+promptTopic), pairs: parsed.map(function(p){
        return { a:p.a, b:p.b };
      }), createdAt: Date.now() };
    }
    DB.games[ui.adminSubject].push(gameObj);
    saveGames(ui.adminSubject);
    showToast('تمت إضافة اللعبة إلى القائمة ✨');
    f.reset();
    render();
  } catch(err){
    showToast('فشل التوليد: ' + ((err && err.message) || String(err)), 'error');
  } finally {
    if(submitBtn){ submitBtn.disabled = false; submitBtn.innerHTML = origLabel; }
  }
  return false;
}

async function generateAIQuestions(btn){
  var topic = window.prompt('ما موضوع الأسئلة؟ (مثال: الكسور، دورة الماء في الطبيعة)');
  if(!topic) return;
  var countStr = window.prompt('كم عدد الأسئلة؟ (بين 1 و 8)', '4');
  var count = Math.max(1, Math.min(8, parseInt(countStr, 10) || 4));
  var subjectName = SUBJECTS[ui.adminSubject].name;
  var origLabel = btn.innerHTML;
  try {
    btn.disabled = true; btn.innerHTML = '⏳ جارٍ التوليد...';
    var promptText = 'أنشئ '+count+' أسئلة اختيار من متعدد مناسبة لتلاميذ السنة السادسة ابتدائي في تونس، لمادة '+subjectName+
      '، حول موضوع: "'+topic+'". أعد النتيجة بصيغة JSON فقط بدون أي نص أو شرح إضافي وبدون علامات ```، بهذا الشكل بالضبط: ' +
      '[{"q":"نص السؤال","options":["خيار1","خيار2","خيار3","خيار4"],"correct":0}] ' +
      'حيث correct هو رقم فهرس الإجابة الصحيحة داخل options (من 0 إلى 3).';
    var text = await callGemini(promptText);
    var cleaned = text.replace(/```json|```/g, '').trim();
    var arr = JSON.parse(cleaned);
    if(!Array.isArray(arr) || arr.length===0){ throw new Error('تنسيق غير متوقع من الذكاء الاصطناعي'); }
    fillGeneratedQuestions(arr);
    showToast('تم توليد '+arr.length+' سؤال، راجعها وعدّلها قبل الحفظ ✨');
  } catch(err){
    showToast('فشل التوليد: ' + ((err && err.message) || String(err)), 'error');
  } finally {
    btn.disabled = false; btn.innerHTML = origLabel;
  }
}
function fillGeneratedQuestions(arr){
  var container = document.getElementById('qRows');
  if(!container) return;
  container.innerHTML = '';
  qRowCounter = 0;
  arr.forEach(function(q){
    var prefill = { text: q.q||'', options: (q.options||['','','','']).slice(0,4), correct: (typeof q.correct==='number'?q.correct:0) };
    container.insertAdjacentHTML('beforeend', questionRowHTML(qRowCounter, prefill));
    qRowCounter++;
  });
}

/* ---------------------------- رفع الملفات ---------------------------- */
function fileToBase64(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){
      var result = reader.result;
      var comma = result.indexOf(',');
      resolve({ base64: result.slice(comma+1), mime: file.type || 'application/octet-stream' });
    };
    reader.onerror = function(){ reject(new Error('تعذّرت قراءة الملف')); };
    reader.readAsDataURL(file);
  });
}
async function uploadFileToServer(file){
  if (file.size > 8 * 1024 * 1024) throw new Error('الملف أكبر من 8 ميغابايت');
  var enc = await fileToBase64(file);
  var res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'uploadFile', name: file.name, mime: enc.mime, data: enc.base64 })
  });
  var data = await res.json();
  if (!data || !data.ok) throw new Error((data && data.error) || 'فشل رفع الملف');
  return data.url;
}

/* لصق نصوص وصور مباشرة داخل محرر ملخص الدرس - الصور تُرفع فورا (لا تُخزَّن كـ base64 كي لا يتجاوز حجم البيانات المسموح به) */
function handleRichPaste(ev, containerId){
  var cd = ev.clipboardData || window.clipboardData;
  if(!cd) return;
  var items = cd.items;
  if(!items) return;
  for(var i=0;i<items.length;i++){
    if(items[i].type && items[i].type.indexOf('image')!==-1){
      ev.preventDefault();
      var file = items[i].getAsFile();
      if(file) uploadPastedImage(file, containerId);
      return;
    }
  }
  /* لا صورة في الحافظة: نترك اللصق الافتراضي للنص يعمل كالمعتاد */
}
async function uploadPastedImage(file, containerId){
  var el = document.getElementById(containerId);
  if(el) el.focus();
  var placeholderId = 'imgph_'+uid();
  try {
    document.execCommand('insertHTML', false, '<span id="'+placeholderId+'" class="img-upload-placeholder">⏳ جارٍ رفع الصورة...</span>');
  } catch(e){
    if(el) el.insertAdjacentHTML('beforeend', '<span id="'+placeholderId+'" class="img-upload-placeholder">⏳ جارٍ رفع الصورة...</span>');
  }
  try {
    var url = await uploadFileToServer(file);
    var ph = document.getElementById(placeholderId);
    if(ph){
      var img = document.createElement('img');
      img.src = driveThumbnailUrl(url);
      ph.replaceWith(img);
    }
  } catch(err){
    var ph2 = document.getElementById(placeholderId);
    if(ph2) ph2.textContent = '⚠️ فشل رفع الصورة';
    showToast('فشل رفع الصورة: ' + ((err && err.message) || String(err)), 'error');
  }
}
function stripHtmlToText(html){
  var div = document.createElement('div');
  div.innerHTML = html;
  return (div.textContent || div.innerText || '').trim();
}
/* روابط Google Drive بصيغة uc?export=view لم تعد تعمل كصورة مضمَّنة (خطأ 403) بسبب تغييرات جوجل الأخيرة على الكوكيز
   الطرفية - لكنها تبقى صالحة كرابط عادي. لذا نحوّلها لصيغة thumbnail عند إدراجها كصورة داخل النص. */
function driveThumbnailUrl(url){
  var m = url && url.match(/[?&]id=([^&]+)/);
  if(m && m[1]) return 'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1000';
  return url;
}
function fixDriveImgUrls(html){
  if(!html) return html;
  return html.replace(/src="https:\/\/drive\.google\.com\/uc\?export=view&id=([^"]+)"/g, 'src="https://drive.google.com/thumbnail?id=$1&sz=w1000"');
}

function setNotesSubject(s){ ui.notesSubject=s; ui.selectedNoteId=null; render(); }
function ensureNoteDefaults(subject){
  if(DB.lessonNotes[subject].length===0){
    NOTE_DEFAULTS[subject].forEach(function(name){
      DB.lessonNotes[subject].push({ id:uid(), name:name, sections:null, updatedAt:null });
    });

}
function addNoteLesson(){
  var input = document.getElementById('newNoteLessonInput');
  var name = input.value.trim();
  if(!name) return;
  var subject = ui.notesSubject;
  if(DB.lessonNotes[subject].some(function(n){ return n.name===name; })){ input.value=''; return; }
  DB.lessonNotes[subject].push({ id:uid(), name:name, sections:null, updatedAt:null });
  saveLessonNotes(subject);
  input.value = '';
  render();
}
function deleteNoteLesson(id){
  var subject = ui.notesSubject;
  var note = DB.lessonNotes[subject].find(function(n){ return n.id===id; });
  if(!note) return;
  if(!confirm('حذف "'+note.name+'"؟ ستُحذف مذكرتها أيضا إن وُجدت.')) return;
  DB.lessonNotes[subject] = DB.lessonNotes[subject].filter(function(n){ return n.id!==id; });

function saveNoteEdits(noteId){
  var subject = ui.notesSubject;

  if(!note) return;
  var defs = NOTE_SECTIONS[subject];

async function generateLessonNote(noteId, isRegen){
  var subject = ui.notesSubject;
  var note = DB.lessonNotes[subject].find(function(n){ return n.id===noteId; });
  if(!note) return;
  var defs = NOTE_SECTIONS[subject];
  var subLabel = SUBJECTS[subject].name;
  var btn = document.getElementById(isRegen ? 'regenNoteBtn' : 'genNoteBtn');
  var origLabel = btn ? btn.innerHTML : '';
  var sectionSpecs = defs.map(function(d){ return '- '+d.title+' ('+d.key+'): '+d.hint; }).join('\n');
  var promptText = 'أنت مستشار بيداغوجي خبير في المنهاج التونسي للتعليم الابتدائي، متخصص في إعداد "مذكرات الدروس" لمعلمي السنة السادسة ابتدائي. ' +
    'تكتب باللغة العربية الفصحى بأسلوب واضح ومباشر يناسب معلمي الابتدائي في تونس، وتقترح أمثلة وأرقاما وتمارين ملموسة ومناسبة لمستوى تلاميذ السنة السادسة (11-12 سنة). ' +
    'أجب حصريا بمصفوفة JSON صالحة دون أي نص إضافي قبلها أو بعدها، ودون علامات كود. الصيغة: [{"key":"...","content":"..."}]. ' +
    'لكل عنصر: key هو المعرف المعطى، وcontent هو محتوى ذلك المكون كاملا ومفصلا (تمارين/أسئلة/وضعيات فعلية بأرقام وأمثلة، وليس وصفا نظريا)، مع استعمال أسطر جديدة (\\n) للفصل بين التمارين أو الفقرات. لا تستعمل رموز Markdown مثل ** أو #.\n\n' +
    'المادة: '+subLabel+'\nعنوان الدرس: '+note.name+'\nالمستوى: السنة السادسة ابتدائي\n\n' +
    'أعدّ مذكرة الدرس وفق المكونات التالية بالترتيب:\n'+sectionSpecs+'\n\n' +
    'اجعل كل مكون متجانسا مع عنوان الدرس تحديدا، وقدّم محتوى قابلا للاستعمال مباشرة في القسم (تمارين، أسئلة، وضعيات) لا مجرد عناوين عامة.';
  try {
    if(btn){ btn.disabled = true; btn.innerHTML = '⏳ جارٍ التوليد...'; }
    var text = await callGemini(promptText);
    var cleaned = text.replace(/```json|```/g, '').trim();
    var parsed = JSON.parse(cleaned);
    var sections = defs.map(function(d){
      var found = parsed.find(function(p){ return p.key===d.key; });
      return { key:d.key, title:d.title, content: found ? found.content : '' };
    });
    note.sections = sections;
    note.updatedAt = Date.now();
    saveLessonNotes(subject);
    showToast('تم توليد المذكرة ✨');
    render();
  } catch(err){
    showToast('فشل التوليد: ' + ((err && err.message) || String(err)), 'error');
    if(btn){ btn.disabled = false; btn.innerHTML = origLabel; }
  }
}

/* --------- ألعاب الفصل الجماعية (مجموعة ألعاب جاهزة تُعرض للتلاميذ) --------- */
function openGroupGamesWindow(){
  try {
    var byteChars = atob(GAMES_COLLECTION_B64);
    var byteNumbers = new Array(byteChars.length);
    for (var i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    var byteArray = new Uint8Array(byteNumbers);
    var blob = new Blob([byteArray], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var w = window.open(url, '_blank');
    if(!w){ showToast('يرجى السماح بالنوافذ المنبثقة لفتح الألعاب في نافذة جديدة', 'error'); }
  } catch(err){
    showToast('تعذّر فتح الألعاب: ' + ((err && err.message) || String(err)), 'error');
  }
}

/* --------- الحساب (تغيير كلمة السر) --------- */
function submitChangePassword(ev){
  ev.preventDefault();
  var f = ev.target;
  var oldPass = f.oldPass.value;
  var newPass = f.newPass.value;
  var newPass2 = f.newPass2.value;
  if(session.user.password !== oldPass){
    showToast('كلمة السر الحالية غير صحيحة', 'error');
    return false;
  }
  if(newPass.length < 4){
    showToast('كلمة السر الجديدة قصيرة جدا (4 أحرف على الأقل)', 'error');
    return false;
  }
  if(newPass !== newPass2){
    showToast('كلمتا السر الجديدتان غير متطابقتين', 'error');
    return false;
  }
  var u = DB.users.find(function(x){ return x.id===session.user.id; });
  if(!u){ showToast('تعذّر العثور على الحساب', 'error'); return false; }
  u.password = newPass;
  session.user.password = newPass;
  saveUsers();
  showToast('تم تغيير كلمة السر بنجاح ✅');
  f.reset();
  return false;
}

function setSeatingClassFilter(g){ ui.seatingClassFilter=g; ui.seatPickerFor=null; render(); }
function currentSeatingClass(){ return ui.seatingClassFilter || classGroupsList()[0] || 'بدون فصل'; }
function currentSeating(){
  var cls = currentSeatingClass();
  if(!DB.seatingByClass[cls]) DB.seatingByClass[cls] = { rows:4, cols:5, seats:{} };
  return DB.seatingByClass[cls];
}
function setSeatingSize(field, delta){
  var seating = currentSeating();
  var v = (seating[field]||1) + delta;
  if(v<1 || v>12) return;
  seating[field] = v;
  saveSeatingByClass(); render();
}
function seatLabel(entry){
  if(!entry) return null;
  return (typeof entry==='string') ? entry : entry.name;
}
function openSeatPicker(r,c){ ui.seatPickerFor = { r:r, c:c }; render(); }
function closeSeatPicker(){ ui.seatPickerFor = null; render(); }
function findSeatKeyForStudent(username){
  var seating = currentSeating();
  var found = null;
  Object.keys(seating.seats).forEach(function(k){
    var e = seating.seats[k];
    if(e && typeof e==='object' && e.username===username) found = k;
  });
  return found;
}
function assignSeat(username){
  var pos = ui.seatPickerFor;
  if(!pos) return;
  var seating = currentSeating();
  var key = pos.r+'_'+pos.c;
  if(!username){
    delete seating.seats[key];
  } else {
    var oldKey = findSeatKeyForStudent(username);
    if(oldKey && oldKey!==key) delete seating.seats[oldKey];
    var stu = DB.users.find(function(u){ return u.username===username; });
    seating.seats[key] = { username: username, name: stu ? stu.name : username };
  }
  ui.seatPickerFor = null;
  saveSeatingByClass(); render();
}
function clearSeatingConfirm(){
  if(!confirm('هل تريد مسح توزيع مقاعد '+esc(currentSeatingClass())+'؟')) return;
  currentSeating().seats = {};
  saveSeatingByClass(); render();
}
function shuffleArray(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function autoAssignSeatsConfirm(){
  var cls = currentSeatingClass();
  var approved = DB.users.filter(function(u){ return u.role==='student' && u.status==='approved' && (u.classGroup||'بدون فصل')===cls; });
  if(approved.length===0){ showToast('لا يوجد تلاميذ مقبولون في '+cls+' بعد', 'error'); return; }
  var seating = currentSeating();
  var rows = seating.rows||1, cols = seating.cols||1, capacity = rows*cols;
  if(!confirm('سيُعاد توزيع تلاميذ '+cls+' عشوائيا على المقاعد ('+capacity+' مقعد)، وسيُلغى التوزيع الحالي لهذا الفصل. متابعة؟')) return;
  var shuffled = shuffleArray(approved);
  var seats = {};
  var idx = 0;
  outer:
  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      if(idx>=shuffled.length) break outer;
      var stu = shuffled[idx++];
      seats[r+'_'+c] = { username: stu.username, name: stu.name };
    }
  }
  seating.seats = seats;
  saveSeatingByClass();
  if(shuffled.length>capacity){
    showToast('تنبيه: عدد تلاميذ '+cls+' ('+shuffled.length+') أكبر من عدد المقاعد ('+capacity+')، لم يُوزَّع الجميع', 'error');
  } else {
    showToast('تم توزيع مقاعد '+cls+' عشوائيا 🔀');
  }
  render();
}
function stepperBlock(label, val, onMinus, onPlus){
  return '<div style="text-align:center"><p class="small-muted" style="margin:0 0 6px">'+esc(label)+'</p>' +
    '<div style="display:flex;align-items:center;gap:10px;justify-content:center">' +
    '<button class="btn-icon" style="background:#F1EEE3;font-weight:800" onclick="'+onMinus+'">−</button>' +
    '<span style="font-weight:800;font-size:16px;min-width:20px">'+val+'</span>' +
    '<button class="btn-icon" style="background:#F1EEE3;font-weight:800" onclick="'+onPlus+'">+</button>' +
    '</div></div>';
}

        '<div class="seat-picker-list">' +
          '<button class="seat-picker-row clear" onclick="assignSeat(\'\')">🗑️ إفراغ المقعد</button>';
    if(approved.length===0){
      html += '<p class="small-muted" style="padding:8px 4px">لا يوجد تلاميذ مقبولون في '+esc(cls)+' بعد.</p>';
    }

      var isHere = seatedElsewhere===(pos.r+'_'+pos.c);
      html += '<button class="seat-picker-row'+(isHere?' active':'')+'" onclick="assignSeat(\''+String(u.username).replace(/'/g,"\\'")+'\')">' +

function todayStr(){
  var d = new Date();
  var mo = String(d.getMonth()+1); if(mo.length<2) mo='0'+mo;
  var da = String(d.getDate()); if(da.length<2) da='0'+da;
  return d.getFullYear()+'-'+mo+'-'+da;
}

function studentSubjectHub(subject, meta){
  var nodes = [
    { key:'lessons',  label:'الدروس والملخصات والتمارين', icon:'📚', color:'#D6447E', light:'#FDEBF2', action:"setStudentContentTab('lessons')" },
    { key:'tests',    label:'التقييمات والاختبارات',        icon:'⏱️', color:'#E08A2B', light:'#FDF1E2', action:"setStudentContentTab('tests')" },
    { key:'results',  label:'النتائج',                      icon:'📋', color:'#7B4FC9', light:'#F1EBFB', action:"setStudentTab('results')" },
    { key:'homework', label:'الواجبات',                     icon:'📤', color:'#3E9B6F', light:'#EAF7EF', action:"setStudentTab('homework')" }
  ];
  var cx = 150, cy = 150, r = 108;
  var angleStep = 360 / nodes.length;
  var html = sectionTitle(meta.name, meta.icon, meta.color);
  html += '<div class="hub-wrap"><div class="hub-diagram">';
  nodes.forEach(function(n, i){
    var angle = -90 + i * angleStep;
    var rad = angle * Math.PI / 180;
    var x = cx + r * Math.cos(rad);
    var y = cy + r * Math.sin(rad);
    var dx = x - cx, dy = y - cy;
    var dist = Math.sqrt(dx*dx + dy*dy);
    var lineAngle = Math.atan2(dy, dx) * 180 / Math.PI;
    html += '<div class="hub-line" style="left:'+cx+'px;top:'+cy+'px;width:'+dist+'px;background:'+n.color+';transform:rotate('+lineAngle+'deg)"></div>';
    html += '<div class="hub-dot" style="left:'+(cx+dx*0.4)+'px;top:'+(cy+dy*0.4)+'px;background:'+n.color+'"></div>';
    html += '<button class="hub-node" style="left:'+x+'px;top:'+y+'px;background:'+n.light+';border-color:'+n.color+'" onclick="'+n.action+'">' +
      '<span class="hub-ic">'+n.icon+'</span><span class="hub-label" style="color:'+n.color+'">'+n.label+'</span></button>';
  });
  html += '<div class="hub-center" style="border-color:'+meta.color+';color:'+meta.color+'">'+esc(meta.short)+'</div>';
  html += '</div></div>';
  return html;
}

function quizScreen(subject){
  var meta = SUBJECTS[subject];
  var q = ui.quiz;
  if(q.submitted){
    var pct = Math.round((q.score/q.test.questions.length)*100);
    var html = '<div class="list-px" style="padding-top:20px;align-items:center;text-align:center">';
    html += Stamp(pct);
    html += '<p style="font-weight:800;font-size:16px;margin:14px 0 0">'+q.score+' من '+q.test.questions.length+' إجابات صحيحة</p>';
    html += '<div style="width:100%;text-align:right;margin-top:18px">';
    q.test.questions.forEach(function(qq,i){
      var correct = q.answers[qq.id]===qq.correct;
      var borderColor = correct ? COLORS.science : COLORS.brick;
      html += '<div class="quiz-review" style="border-color:'+borderColor+'">' +
        '<span style="color:'+borderColor+';font-weight:800">'+(correct?'✅':'❌')+'</span>' +
        '<div><p style="font-weight:800;font-size:13.5px;margin:0">'+(i+1)+'. '+esc(qq.text)+'</p>' +
        '<p class="small-muted" style="margin:5px 0 0">الإجابة الصحيحة: '+esc(qq.options[qq.correct])+'</p></div></div>';
    });
    html += '</div>';
    html += '<div style="width:100%;margin:16px 0 30px">' + Btn('✅ إنهاء ومتابعة', { block:true, color:meta.color, onclick:'finishQuiz()' }) + '</div>';
    html += '</div>';
    return html;
  }

  var html = '<div class="list-px" style="padding-bottom:30px">';
  html += '<button class="link-btn" style="color:'+meta.color+'" onclick="exitQuiz()">→ إلغاء الاختبار</button>';
  html += '<p class="display" style="font-size:21px;margin:4px 0 12px">'+esc(q.test.title)+'</p>';
  html += '<form id="quizForm" onsubmit="return submitQuiz(event)">';
  q.test.questions.forEach(function(qq,i){
    html += '<div class="quiz-q"><p class="qtext">'+(i+1)+'. '+esc(qq.text)+'</p>';
    qq.options.forEach(function(opt, oi){
      html += '<label class="quiz-opt"><input type="radio" name="ans_'+qq.id+'" value="'+oi+'" style="accent-color:'+meta.color+'" required>' +
        '<span style="font-size:13.5px">'+esc(opt)+'</span></label>';
    });
    html += '</div>';
  });
  html += Btn('✅ تسليم الإجابات', { block:true, color:meta.color, type:'submit' });
  html += '</form></div>';
  return html;
}
function submitQuiz(ev){
  ev.preventDefault();
  var f = ev.target;
  var q = ui.quiz;
  var answers = {}, score = 0;
  var allAnswered = true;
  q.test.questions.forEach(function(qq){
    var checked = f.querySelector('input[name="ans_'+qq.id+'"]:checked');
    if(!checked){ allAnswered = false; return; }
    var val = parseInt(checked.value,10);
    answers[qq.id] = val;
    if(val===qq.correct) score++;
  });
  if(!allAnswered){ showToast('أجب عن كل الأسئلة قبل التسليم','error'); return false; }
  q.answers = answers; q.score = score; q.submitted = true;

  DB.results.push({
    id: uid(), studentUsername: session.user.username, subject: q.subject, lessonId: null,
    testId: q.test.id, testTitle: q.test.title, score: score, total: q.test.questions.length, date: Date.now()
  });
  saveResults();
  render();
  return false;
}
function finishQuiz(){ ui.quiz=null; render(); }

  { q:'أي هذه الحيوانات من الثدييات؟', options:['السمكة','الضفدع','الحوت','الحيّة'], correct:2 },
  { q:'ما حالة الماء عند التجمّد؟', options:['غازية','سائلة','صلبة','بخار'], correct:2 },
  { q:'من أين تحصل النباتات على الطاقة؟', options:['التربة','الشمس','الماء فقط','الهواء فقط'], correct:1 },
  { q:'كم عدد أرجل الحشرة؟', options:['4','6','8','10'], correct:1 },
  { q:'ما الغاز الذي تنتجه النباتات نهارا؟', options:['ثاني أكسيد الكربون','الأكسجين','النيتروجين','الميثان'], correct:1 },
  { q:'ما مصدر الضوء الطبيعي الأساسي على الأرض؟', options:['القمر','النجوم','الشمس','البرق'], correct:2 },
  { q:'أين تختزن النباتات غذاءها غالبا؟', options:['الجذور والسيقان والأوراق','الهواء','السحاب','الحجر'], correct:0 }
];
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function generateMathQuestion(){
  var ops = ['+','−','×','÷'];
  var op = ops[randInt(0,3)];
  var a,b,answer,qtext;
  if(op==='+'){ a=randInt(10,90); b=randInt(10,90); answer=a+b; qtext=a+' + '+b; }
  else if(op==='−'){ a=randInt(20,99); b=randInt(1,a-1); answer=a-b; qtext=a+' − '+b; }
  else if(op==='×'){ a=randInt(2,12); b=randInt(2,12); answer=a*b; qtext=a+' × '+b; }
  else { b=randInt(2,12); answer=randInt(2,12); a=b*answer; qtext=a+' ÷ '+b; }
  var opts=[answer];
  while(opts.length<4){
    var delta = randInt(1,10) * (Math.random()<0.5?-1:1);
    var d = answer+delta;
    if(d>=0 && opts.indexOf(d)===-1) opts.push(d);
  }
  opts = shuffleArr(opts);
  return { text: qtext, options: opts.map(String), correctIndex: opts.indexOf(answer) };
}
var eveilQueue = [];
function nextEveilQuestion(){
  if(eveilQueue.length===0) eveilQueue = shuffleArr(EVEIL_QUESTIONS);
  var q = eveilQueue.pop();
  return { text: q.q, options: q.options, correctIndex: q.correct };
}

var gameTimer = null;
function setGameSubject(s){ ui.gameSubject=s; render(); }
function exitGame(silent){
  if(gameTimer){ clearInterval(gameTimer); gameTimer=null; }
  ui.activeGame = null;
  if(!silent) render();
}

function startSpeedGame(subject, gameId){
  eveilQueue = [];
  ui.activeGame = { type:'speed', subject:subject, gameId:gameId||null, score:0, timeLeft:45, question:null, feedback:null, finished:false };
  ui.activeGame.question = nextSpeedQuestionFor(ui.activeGame);
  if(gameTimer) clearInterval(gameTimer);
  gameTimer = setInterval(function(){
    if(!ui.activeGame || ui.activeGame.type!=='speed'){ clearInterval(gameTimer); gameTimer=null; return; }
    ui.activeGame.timeLeft--;
    if(ui.activeGame.timeLeft<=0){
      ui.activeGame.timeLeft = 0;
      ui.activeGame.finished = true;
      clearInterval(gameTimer); gameTimer=null;
    }
    render();
  }, 1000);
  render();
}
function nextSpeedQuestionFor(g){
  if(g.gameId){
    var game = DB.games[g.subject].find(function(x){ return x.id===g.gameId; });
    if(game && game.questions && game.questions.length){
      var q = game.questions[randInt(0, game.questions.length-1)];
      return { text: q.q, options: q.options, correctIndex: q.correct };
    }
  }
  return g.subject==='math' ? generateMathQuestion() : nextEveilQuestion();
}
function answerSpeedQuestion(idx){
  var g = ui.activeGame;
  if(!g || g.finished || g.feedback) return;
  if(idx===g.question.correctIndex){ g.score++; g.feedback='correct'; }
  else { g.feedback='wrong'; }
  render();
  setTimeout(function(){
    if(!ui.activeGame || ui.activeGame.finished) return;
    ui.activeGame.feedback = null;
    ui.activeGame.question = nextSpeedQuestionFor(ui.activeGame);
    render();
  }, 550);
}
function speedGameScreen(meta){
  var g = ui.activeGame;
  var html = '<div class="list-px" style="padding-bottom:24px">';
  html += '<button class="link-btn" style="color:'+meta.color+'" onclick="exitGame()">→ الخروج من اللعبة</button>';
  if(g.finished){
    html += '<div class="card" style="text-align:center;margin-top:14px">' +
      '<p style="font-size:40px;margin:0 0 8px">🏁</p>' +
      '<p class="display" style="font-size:20px;margin:0">انتهى الوقت!</p>' +
      '<p style="font-size:32px;font-weight:800;color:'+meta.color+';margin:10px 0">'+g.score+'</p>' +
      '<p class="small-muted" style="margin:0 0 16px">نقطة صحيحة</p>' +
      Btn('🔁 إعادة المحاولة', {color:meta.color, onclick:"startSpeedGame('"+g.subject+"'"+(g.gameId?",'"+g.gameId+"'":"")+")"}) +
      '</div>';
    html += '</div>';
    return html;
  }
  html += '<div class="game-hud"><span class="game-timer" style="color:'+(g.timeLeft<=10?COLORS.brick:meta.color)+'">⏱️ '+g.timeLeft+'</span>' +
    '<span class="game-score" style="color:'+meta.color+'">⭐ '+g.score+'</span></div>';
  html += '<div class="game-qcard"><p class="game-qtext">'+esc(g.question.text)+'</p></div>';
  html += '<div class="game-opts">';
  g.question.options.forEach(function(opt, i){
    var cls = '';
    if(g.feedback){
      if(i===g.question.correctIndex) cls = ' correct';
      else if(g.feedback==='wrong' && i!==g.question.correctIndex) cls='';
    }
    html += '<button class="game-opt'+cls+'" style="border-color:'+meta.color+'44" onclick="answerSpeedQuestion('+i+')">'+esc(opt)+'</button>';
  });
  html += '</div>';
  html += '</div>';
  return html;
}

function startMemoryGame(subject, gameId){
  var pairsSource = GAME_BANK[subject].memory;
  if(gameId){
    var game = DB.games[subject].find(function(x){ return x.id===gameId; });
    if(game && game.pairs && game.pairs.length) pairsSource = game.pairs;
  }
  var pairs = shuffleArr(pairsSource).slice(0,6);
  var cards = [];
  pairs.forEach(function(p,i){
    cards.push({ id:i+'a', pairId:i, text:p.a, revealed:false, matched:false });
    cards.push({ id:i+'b', pairId:i, text:p.b, revealed:false, matched:false });
  });
  cards = shuffleArr(cards);
  ui.activeGame = { type:'memory', subject:subject, gameId:gameId||null, cards:cards, flippedIds:[], moves:0, matchedCount:0, totalPairs:pairs.length, busy:false };
  render();
}
function flipMemoryCard(id){
  var g = ui.activeGame;
  if(!g || g.type!=='memory' || g.busy) return;
  var card = g.cards.find(function(c){ return c.id===id; });
  if(!card || card.matched || card.revealed) return;
  if(g.flippedIds.length>=2) return;
  card.revealed = true;
  g.flippedIds.push(id);
  if(g.flippedIds.length===2){
    g.moves++;
    var c1 = g.cards.find(function(c){ return c.id===g.flippedIds[0]; });
    var c2 = g.cards.find(function(c){ return c.id===g.flippedIds[1]; });
    if(c1.pairId===c2.pairId){
      c1.matched = true; c2.matched = true;
      g.matchedCount++;
      g.flippedIds = [];
    } else {
      g.busy = true;
      setTimeout(function(){
        if(!ui.activeGame) return;
        c1.revealed = false; c2.revealed = false;
        ui.activeGame.flippedIds = [];
        ui.activeGame.busy = false;
        render();
      }, 800);
    }
  }
  render();
}
function memoryGameScreen(meta){
  var g = ui.activeGame;
  var won = g.matchedCount === g.totalPairs;
  var html = '<div class="list-px" style="padding-bottom:24px">';
  html += '<button class="link-btn" style="color:'+meta.color+'" onclick="exitGame()">→ الخروج من اللعبة</button>';
  if(won){
    html += '<div class="card" style="text-align:center;margin-top:14px">' +
      '<p style="font-size:40px;margin:0 0 8px">🎉</p>' +
      '<p class="display" style="font-size:20px;margin:0">أحسنت!</p>' +
      '<p class="small-muted" style="margin:10px 0 16px">أنهيت المطابقة في '+g.moves+' محاولة</p>' +
      Btn('🔁 لعبة جديدة', {color:meta.color, onclick:"startMemoryGame('"+g.subject+"'"+(g.gameId?",'"+g.gameId+"'":"")+")"}) +
      '</div>';
    html += '</div>';
    return html;
  }
  html += '<div class="game-hud"><span class="game-score" style="color:'+meta.color+'">🔁 '+g.moves+' محاولة</span>' +
    '<span class="game-score" style="color:'+meta.color+'">✅ '+g.matchedCount+'/'+g.totalPairs+'</span></div>';
  html += '<div class="memory-grid">';
  g.cards.forEach(function(c){
    var shown = c.revealed || c.matched;
    html += '<button class="memory-card'+(c.matched?' matched':'')+(shown?' flipped':'')+'" style="'+(shown?('background:'+meta.light+';color:'+meta.color+';border-color:'+meta.color):'')+'" onclick="flipMemoryCard(\''+c.id+'\')">' +
      (shown ? esc(c.text) : '❓') + '</button>';
  });
  html += '</div>';
  html += '</div>';
  return html;
}

function gamesScreen(){
  var subj = ui.gameSubject || 'math';
  var meta = SUBJECTS[subj];
  if(ui.activeGame){
    if(ui.activeGame.type==='speed') return speedGameScreen(meta);
    if(ui.activeGame.type==='memory') return memoryGameScreen(meta);
  }
  var html = sectionTitle('الألعاب التفاعلية', '🎮');
  html += '<div class="tabpill-row">';
  Object.keys(SUBJECTS).forEach(function(k){
    var s = SUBJECTS[k]; var active = subj===k;
    html += '<button class="tabpill" style="'+(active?('background:'+s.color+';color:#fff;border-color:'+s.color):('color:'+s.color+';border-color:'+s.color+'55'))+'" onclick="setGameSubject(\''+k+'\')">'+esc(s.name)+'</button>';
  });
  html += '</div>';
  html += '<div class="list-px" style="padding-bottom:24px">';
  html += gameCard('⚡','تحدي السرعة','أجب عن أكبر عدد من الأسئلة قبل نفاد الوقت', meta.color, "startSpeedGame('"+subj+"')");
  html += gameCard('🧠','لعبة الذاكرة','طابق كل بطاقتين متشابهتين بأقل عدد محاولات', meta.color, "startMemoryGame('"+subj+"')");
  var custom = DB.games[subj] || [];
  if(custom.length>0){
    html += '<p style="margin:16px 4px 4px;font-weight:800;font-size:12.5px;color:'+meta.color+'">✨ ألعاب المعلّم</p>';
    custom.forEach(function(g){
      if(g.type==='speed'){
        html += gameCard('⚡', g.title, g.questions.length+' سؤال', meta.color, "startSpeedGame('"+subj+"','"+g.id+"')");
      } else {
        html += gameCard('🧠', g.title, g.pairs.length+' زوج', meta.color, "startMemoryGame('"+subj+"','"+g.id+"')");
      }
    });
  }
  html += '</div>';
  return html;
}
function gameCard(icon,title,desc,color,onclick){
  return '<button class="row-card" style="width:100%;text-align:right;cursor:pointer" onclick="'+onclick+'">' +
    '<span style="font-size:28px">'+icon+'</span>' +
    '<div class="info"><p class="t1">'+esc(title)+'</p><p class="t2">'+esc(desc)+'</p></div>' +
    '<span style="color:#9CA79F;font-size:18px">‹</span></button>';
}

function bootError(msg){
  document.getElementById('root').innerHTML =
    '<div class="center-screen"><div class="auth-wrap" style="text-align:center">' +
    '<div class="brand-badge" style="margin:0 auto 14px;background:'+COLORS.brick+'">⚠️</div>' +
    '<p class="display" style="font-size:20px;color:'+COLORS.brick+'">تعذّر الاتصال بالخادم</p>' +
    '<p class="small-muted" style="margin:10px 0 18px">'+esc(msg)+'</p>' +
    '<button class="btn" style="background:'+COLORS.ink+';color:#fff" onclick="boot()">إعادة المحاولة</button>' +
    '</div></div>';
}

  try {

    bootError('تعذّر تحميل قائمة الحسابات. تحقّق من اتصال الإنترنت ثم أعد المحاولة. (' + String((e && e.message) || e) + ')');

    ]);

    DB.videos.math = vals[6]; DB.videos.eveil = vals[7];
    DB.games.math = vals[8]; DB.games.eveil = vals[9];
    DB.lessonNotes.math = vals[10]; DB.lessonNotes.eveil = vals[11];

  } catch (e) {

  }
}
boot();
